[build]
  # Build command for Next.js - using npm install for better compatibility
  command = "npm install && npm run build"
  
  # Output directory for Next.js build
  publish = ".next"

[build.environment]
  # Next.js specific environment variables
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  NODE_VERSION = "18.20.4"
  # Ensure npm uses the correct registry
  NPM_CONFIG_REGISTRY = "https://registry.npmjs.org/"
  # Additional build environment variables
  CI = "true"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  # Prevent npm warnings and errors
  NPM_CONFIG_UPDATE_NOTIFIER = "false"
  NPM_CONFIG_PROGRESS = "false"
  # Ensure consistent builds
  NPM_CONFIG_PACKAGE_LOCK = "true"
  NPM_CONFIG_SAVE = "false"

# Netlify Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"